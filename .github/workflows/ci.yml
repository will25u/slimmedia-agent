name: CI & Release Signing

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        env:
          SLIMMEDIA_SKIP_MEMORY_CHECK: "1"
        run: go test -v ./...

      - name: Cross-compile validation
        run: |
          GOOS=windows go build ./...
          GOOS=linux go build ./...

  build-windows:
    name: Build Windows Executable
    runs-on: ubuntu-latest
    needs: test
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Windows Tray Application
        id: compile
        run: |
          mkdir -p dist
          AGENT_VERSION=$(cat VERSION)
          AGENT_PUBKEY=$(cat release-public.key)

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H=windowsgui -X github.com/will25u/slimmedia-agent/internal/daemon.Version=${AGENT_VERSION} -X github.com/will25u/slimmedia-agent/internal/updater.ReleasePublicKeyHex=${AGENT_PUBKEY}" \
            -o dist/slimmedia-agent-windows-amd64.exe ./cmd/tray

          cd dist
          sha256sum slimmedia-agent-windows-amd64.exe > slimmedia-agent-windows-amd64.exe.sha256
          cd ..

      - name: Upload Unsigned Artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimmedia-agent-windows-amd64-unsigned
          path: dist/slimmedia-agent-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    name: Sign Windows Binary (SignPath)
    runs-on: ubuntu-latest
    needs: build-windows
    # Runs when SignPath secrets are configured and on release/tag or main push
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check SignPath Configuration
        id: check-secrets
        run: |
          if [ -z "${{ secrets.SIGNPATH_API_TOKEN }}" ]; then
            echo "SignPath API token not configured yet. Skipping signing step (Pending Ticket 2)."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Submit Signing Request to SignPath Foundation
        if: steps.check-secrets.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: slimmedia-agent
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed-dist'

      - name: Upload Signed Artifact
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slimmedia-agent-windows-amd64-signed
          path: signed-dist/
          retention-days: 30
