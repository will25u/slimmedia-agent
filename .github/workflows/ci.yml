name: CI & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        env:
          SLIMMEDIA_SKIP_MEMORY_CHECK: "1"
        run: go test -v ./...

      - name: Cross-compile validation
        run: |
          GOOS=windows go build ./...
          GOOS=linux go build ./...
